version: '3.8'

services:
  # --- Base de données MySQL ---
  mysql:
    image: mysql:8.0
    container_name: task-core-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: taskdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - task-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Application Spring Boot ---
  app:
    build: .
    container_name: task-core-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskdb
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SERVER_PORT: 8085
    ports:
      - "8085:8085"
    networks:
      - task-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  task-network:
    driver: bridge
