# =============================================
# Task Core - CI/CD Pipeline (GitHub Actions)
# =============================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # --- Job 1: Build & Test ---
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: taskdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 📦 Build with Maven
        run: mvn clean compile -B
        env:
          DB_URL: jdbc:mysql://localhost:3306/taskdb
          DB_USERNAME: root
          DB_PASSWORD: testpassword

      - name: 🧪 Run Tests
        run: mvn test -B
        env:
          DB_URL: jdbc:mysql://localhost:3306/taskdb
          DB_USERNAME: root
          DB_PASSWORD: testpassword

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # --- Job 2: Package ---
  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 📦 Package JAR
        run: mvn clean package -DskipTests -B

      - name: 📤 Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-core-jar
          path: target/*.jar

  # --- Job 3: Docker Build ---
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker Image
        run: docker build -t task-core:${{ github.sha }} .

      - name: 🏷️ Tag Docker Image
        run: |
          docker tag task-core:${{ github.sha }} task-core:latest
